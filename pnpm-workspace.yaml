# pnpm 11 reads its configuration from this file, not from .npmrc (only auth and registry settings stay
# there). No `packages:` key: the root package is the whole workspace.

# Supply-chain baseline: a version must be public for 7 days before it resolves, strict — no fallback
# to a younger one. A just-published version fails `pnpm add` by design.
minimumReleaseAge: 10080
minimumReleaseAgeStrict: true

# `pnpm add` writes an exact version, with no `^` (decision 0002).
saveExact: true

# dw-sdlc is the owner's own package and runs the Gate, so a release is usable the day it ships. The
# exclusion goes if anyone else ever publishes it.
minimumReleaseAgeExclude:
  - dw-sdlc

# Refuse a version published with weaker provenance than an earlier one of the same package.
trustPolicy: no-downgrade

# Transitive dependencies resolve from the registry only — no git or tarball URLs.
blockExoticSubdeps: true

# A dependency's install scripts run only when listed under `allowBuilds`; anything else fails install.
strictDepBuilds: true

# The weekly Security audit workflow fails on advisories at this level or above.
audit:
  level: high

# vite-plus aliases `vite` to its own core, whose version vitest's `vite` peer range does not name.
# `vp migrate` writes the same rule.
peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: "*"
