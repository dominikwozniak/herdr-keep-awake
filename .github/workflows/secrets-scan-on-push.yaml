name: Secrets scan on push

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scan:
    # A squash merge lands with `(#NN)` in its subject, and its pull request was already scanned. The
    # push that creates `main` has no `before` commit for the scan to start from.
    if: ${{ !github.event.created && !contains(github.event.head_commit.message, '(#') }}
    uses: byarcadia-app/gh-actions-public/.github/workflows/secrets-scan-on-push.yaml@1f5320e29ee1cf0ff1e3712e6b1298564edddca9 # v1.1.0
